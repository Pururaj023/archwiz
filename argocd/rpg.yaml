apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gamepicks-rpg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/game-picks.git
    targetRevision: main
    path: pages/rpg/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
