name: home page

on:
  push:
    branches: [main]
    paths:
      - "pages/home/**"
      - "shared/**"
      - ".github/workflows/home.yml"
  workflow_dispatch:

env:
  PAGE: home
  DOCKERHUB_USER: pururajchoudhary23
  IMAGE: pururajchoudhary23/gamepicks-home

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: pages/home/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # GitOps: write the new image tag into the manifest and commit it.
  # Argo CD (running inside minikube) sees the commit and deploys it.
  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag
        run: |
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" pages/home/k8s/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/home/k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(home): ${{ github.sha }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
