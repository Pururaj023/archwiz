name: rpg page

on:
  push:
    branches: [main]
    paths:
      - "pages/rpg/**"
      - "shared/**"
      - ".github/workflows/rpg.yml"
  workflow_dispatch:

env:
  PAGE: rpg
  DOCKERHUB_USER: pururajchoudhary23
  IMAGE: pururajchoudhary23/gamepicks-rpg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: pages/rpg/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # Runs on YOUR machine (the one running minikube), because GitHub's cloud
  # runners cannot reach a minikube cluster on localhost.
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to minikube
        run: |
          kubectl config use-context minikube
          sed "s|IMAGE_PLACEHOLDER|${{ env.IMAGE }}:${{ github.sha }}|" pages/rpg/k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/gamepicks-rpg --timeout=120s
