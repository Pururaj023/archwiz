apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamepicks-action
  labels:
    app: gamepicks-action
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gamepicks-action
  template:
    metadata:
      labels:
        app: gamepicks-action
    spec:
      containers:
        - name: web
          # The pipeline rewrites this tag to the new commit SHA; Argo CD then syncs it.
          image: pururajchoudhary23/gamepicks-action:4bce74fa5510a16eb00cc88ee1a00474548032a8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gamepicks-action
spec:
  selector:
    app: gamepicks-action
  ports:
    - port: 80
      targetPort: 8080
