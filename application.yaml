apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gamepicks-home
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pururaj023/archwiz.git
    targetRevision: main
    path: pages/home/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: game
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
